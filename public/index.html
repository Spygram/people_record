<!DOCTYPE html>
<html>
<head>
  <title>Add Person Detail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Add a Person</h1>

  <form id="personForm">
    <label> Full Name: <input type="text" name="name" required></label><br><br>
    <label>Age: <input type="number" name="age" required></label><br><br>
    <button type="submit">Submit</button>
  </form>

  <h2>People List</h2>

  <table id="peopleTable">
    <tr>
      <th>SN</th>
      <th>Name</th>
      <th>Age</th>
      <th>Action</th>
    </tr>
  </table>

  <script>
    const API_BASE = "http://3.239.216.252:3000";

    const table = document.getElementById('peopleTable');
    const form = document.getElementById('personForm');

    async function loadPeople() {
      const res = await fetch(`${API_BASE}/people`);
      const people = await res.json();

      table.innerHTML = `
        <tr>
          <th>SN</th>
          <th>Name</th>
          <th>Age</th>
          <th>Action</th>
        </tr>
      `;

      people.forEach((p, index) => {
        const row = table.insertRow();

        row.insertCell(0).textContent = index + 1;
        row.insertCell(1).textContent = p.name;
        row.insertCell(2).textContent = p.age;

        const delCell = row.insertCell(3);
        const btn = document.createElement('button');
        btn.textContent = 'Delete';
        btn.classList.add('delete-btn');

        btn.onclick = async () => {
          await fetch(`${API_BASE}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: p.serial_number })
          });

          loadPeople();
        };

        delCell.appendChild(btn);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = Object.fromEntries(formData);

      await fetch(`${API_BASE}/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      form.reset();
      loadPeople();
    });

    loadPeople();
  </script>
</body>
</html>
